; Session cookie hardening for PHP-FPM / CGI / LSAPI hosts.
; Applies even to legacy pages that call session_start() before core/db.php.
; (core/db.php additionally sets these at runtime, including "secure" on HTTPS.)
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
display_errors = 0
log_errors = 1
